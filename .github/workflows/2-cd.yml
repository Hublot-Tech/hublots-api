name: CD

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-22.04

    permissions:
      contents: read # Allows reading repository content
      packages: write # Allows publishing packages to GHCR

    env:
      # Define environment variables for Docker Compose
      MONGO_URI: mongodb://${{ secrets.MONGO_INITDB_ROOT_USERNAME }}:${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}@mongo1:27017,mongo2:27018,mongo3:27019/?replicaSet=rs0
      MONGO_INITDB_DATABASE: ${{ secrets.MONGO_INITDB_DATABASE }}
      MONGO_INITDB_ROOT_USERNAME: ${{ secrets.MONGO_INITDB_ROOT_USERNAME }}
      MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}
      BCRYPT_SALT: ${{ vars.BCRYPT_SALT }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      NOTCHPAY_PK: ${{ secrets.NOTCHPAY_PK }}
      NOTCHPAY_SK: ${{ secrets.NOTCHPAY_SK }}
      META_MESSAGING_API_BASE_URL: ${{ secrets.META_MESSAGING_API_BASE_URL }}
      META_MESSAGING_API_ACCESS_TOKEN: ${{ secrets.META_MESSAGING_API_ACCESS_TOKEN }}
      GEOAPIFY_KEY: ${{ secrets.GEOAPIFY_KEY }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PHONE_NUMBER: ${{ secrets.ADMIN_PHONE_NUMBER }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      REGISTRY_USERNAME: ${{ github.actor }}
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ vars.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute Pre-Build Script
        run: |
          if [ -f create-env.sh ]; then
            chmod +x create-env.sh;
            ./create-env.sh
          else echo "create-env script not found." && exit 1;
          fi

      - name: Build and Push Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: | 
            ${{ vars.CONTAINER_REGISTRY }}/hublots/hublots-api:latest

      - name: Deploy on server
        if: ${{ github.ref == 'refs/heads/master' }}
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          if [ -f deploy.sh ]; then
            chmod +x deploy.sh;
            ./deploy.sh
          else echo "Deploy script not found." && exit 1;
          fi
