# docker-compose.yml
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${CONTAINER_REGISTRY}/${REGISTRY_USERNAME}/hublots-api:latest"
    container_name: hublots_api
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads

  mongodb:
    image: mongo
    restart: always
    container_name: hublots_mongodb
    ports:
      - "27017:27017"
    env_file:
      - .env
    volumes:
      - mongo_data:/data/db  # Maps MongoDB data to a named volume for persistence

volumes:
  mongo_data:  # This is the named volume for MongoDB persistence
